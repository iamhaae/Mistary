  <!-- ============ 배경 공간 ============ -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="wall"></div>

    <!-- 먼 벽: 창문 -->
    <div class="layer layer-far" data-depth="7">
      <div class="windows">
        <svg class="win side"><use href="#lancet"/></svg>
        <svg class="win side"><use href="#lancet"/></svg>
        <svg class="win center"><use href="#gothic-window"/></svg>
        <svg class="win side"><use href="#lancet"/></svg>
        <svg class="win side"><use href="#lancet"/></svg>
      </div>
      <div class="win-bloom"></div>
    </div>

    <!-- 빛: 가운데 창에서 퍼지는 빛살 + 왼쪽 위에서 비스듬히 쏟아지는 빛줄기 -->
    <div class="layer layer-mid" data-depth="14">
      <div class="rays"></div>
      <div class="shaft shaft-a"></div>
      <div class="shaft shaft-b"></div>
      <div class="shaft shaft-c"></div>
    </div>

    <div class="floor"><div class="pool"></div></div>

    <!-- 가까운 벽: 어두운 석조 아치 틀 -->
    <div class="layer layer-near" data-depth="22">
      <svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#241b14"/>
            <stop offset=".45" stop-color="#0c0807"/>
            <stop offset="1" stop-color="#040202"/>
          </linearGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffe2aa" stop-opacity=".6"/>
            <stop offset=".5" stop-color="#ffe2aa" stop-opacity=".14"/>
            <stop offset="1" stop-color="#ffe2aa" stop-opacity=".04"/>
          </linearGradient>
        </defs>
        <path fill="url(#stone)" fill-rule="evenodd"
              d="M-6 -6 H106 V106 H-6Z M9 106 V48 Q9 14 50 2.5 Q91 14 91 48 V106Z"/>
        <path d="M9 106 V48 Q9 14 50 2.5 Q91 14 91 48 V106" fill="none" stroke="url(#rim)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <path d="M6.2 106 V47 Q6.2 10 50 -1 Q93.8 10 93.8 47 V106" fill="none" stroke="rgba(150,115,65,.22)" stroke-width="1" vector-effect="non-scaling-stroke"/>

      </svg>
    </div>

    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

      <div class="rule title-rule"><i>◆</i></div>
      <p class="org-sub" id="orgSub"></p>
    </header>

        <span class="door-plate"><span class="door-face">
          <span class="door-orn">◆ &nbsp; I &nbsp; ◆</span>

    </nav>
