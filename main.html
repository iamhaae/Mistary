<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050403">
  <title>로비</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-main">
  <div class="veil is-on"></div>

  <!-- 고딕 창 (한 번 정의해서 여러 번 재사용) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="winGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6de"/>
        <stop offset=".55" stop-color="#f0cf92"/>
        <stop offset="1" stop-color="#b98b4a"/>
      </linearGradient>
      <pattern id="lattice" width="12" height="16" patternUnits="userSpaceOnUse">
        <path d="M0 0 L12 16 M12 0 L0 16" stroke="#120e08" stroke-width=".9" fill="none"/>
      </pattern>
      <symbol id="gothic-window" viewBox="0 0 100 210">
        <!-- 석조 틀 -->
        <path d="M2 210 V82 Q2 28 50 2 Q98 28 98 82 V210 Z" fill="#14100b" stroke="#6b5530" stroke-width="1"/>
        <path d="M8 210 V84 Q8 36 50 12 Q92 36 92 84 V210 Z" fill="#0b0907" stroke="#3b2f1c" stroke-width=".8"/>
        <!-- 유리 -->
        <path d="M13 206 V85 Q13 42 50 20 Q87 42 87 85 V206 Z" fill="url(#winGlow)"/>
        <path d="M13 206 V85 Q13 42 50 20 Q87 42 87 85 V206 Z" fill="url(#lattice)"/>
        <!-- 세로 문설주 -->
        <path d="M50 20 V206 M31.5 206 V70 M68.5 206 V70" stroke="#120e08" stroke-width="2.2" fill="none"/>
        <!-- 상단 장미창 -->
        <circle cx="50" cy="52" r="9" fill="#0b0907"/>
        <circle cx="50" cy="52" r="6.4" fill="url(#winGlow)"/>
        <path d="M50 45.6 V58.4 M43.6 52 H56.4 M45.5 47.5 L54.5 56.5 M54.5 47.5 L45.5 56.5" stroke="#120e08" stroke-width="1" fill="none"/>
        <!-- 하단 창턱 -->
        <rect x="0" y="204" width="100" height="6" fill="#1a140c"/>
      </symbol>
    </defs>
  </svg>

  <!-- 배경 공간: 건축 + 빛 -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="wall"></div>

    <svg class="vault" viewBox="0 0 1000 320" preserveAspectRatio="none">
      <g fill="none" stroke="#2a2218" stroke-width="2">
        <path d="M0 320 Q160 120 500 0"/>
        <path d="M1000 320 Q840 120 500 0"/>
        <path d="M0 220 Q220 90 500 0" opacity=".6"/>
        <path d="M1000 220 Q780 90 500 0" opacity=".6"/>
      </g>
    </svg>

    <div class="windows">
      <svg class="win"><use href="#gothic-window"/></svg>
      <svg class="win"><use href="#gothic-window"/></svg>
      <svg class="win win-center"><use href="#gothic-window"/></svg>
      <svg class="win"><use href="#gothic-window"/></svg>
      <svg class="win"><use href="#gothic-window"/></svg>
    </div>

    <div class="beam beam-a"></div>
    <div class="beam beam-b"></div>
    <div class="beam beam-c"></div>

    <div class="pillar pillar-l"></div>
    <div class="pillar pillar-r"></div>
    <div class="floor"></div>
    <div class="vignette"></div>
  </div>

  <a class="replay" href="index.html" aria-label="초대장 다시 보기">✦</a>

  <main class="lobby">
    <header class="title-block" id="titleBlock">
      <p class="eyebrow">RECORDS · OF · AGES</p>
      <h1 class="org-name gold-text" id="orgName">THE INSTITUTE</h1>
      <div class="rule title-rule"><i>◆</i></div>
      <p class="org-sub" id="orgSub"></p>
    </header>

    <nav class="doors" aria-label="주요 공간">
      <a class="door" href="investigation.html" data-page="investigation">
        <span class="door-plate"><span class="door-face">
          <span class="door-orn">◆ &nbsp; I &nbsp; ◆</span>
          <span class="door-en">INVESTIGATION ROOM</span>
          <span class="door-ko">조 사 실</span>
          <span class="door-desc">새로운 사건을 조사한다</span>
        </span></span>
      </a>
      <a class="door" href="archive.html" data-page="archive">
        <span class="door-plate"><span class="door-face">
          <span class="door-orn">◆ &nbsp; II &nbsp; ◆</span>
          <span class="door-en">ARCHIVE</span>
          <span class="door-ko">서 고</span>
          <span class="door-desc">쌓여 온 기록을 열람한다</span>
        </span></span>
      </a>
    </nav>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
